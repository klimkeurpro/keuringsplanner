<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Optie 3: Klembord met klimset / veiligheidsstijl -->
  <rect width="512" height="512" rx="90" fill="#fff"/>
  <!-- Groene band bovenaan -->
  <rect width="512" height="180" rx="0" fill="#00A651"/>
  <rect width="512" height="90" rx="0" fill="#00A651"/>
  <rect x="0" y="90" width="512" height="90" rx="0" fill="#008C44"/>
  <rect width="512" height="180" rx="90" fill="none"/>
  <!-- Clip bovenaan rondingen meenemen -->
  <rect x="0" y="0" width="512" height="90" rx="0" fill="#00A651"/>
  <!-- Top rounding fix -->
  <rect x="0" y="0" width="512" height="90" fill="#00A651" rx="90"/>
  <rect x="0" y="45" width="512" height="135" fill="#008C44"/>

  <!-- Klembord lichaam -->
  <rect x="80" y="130" width="352" height="310" rx="18" fill="#F1F5F9"/>
  <rect x="80" y="130" width="352" height="40" rx="0" fill="#F1F5F9"/>
  <rect x="80" y="150" width="352" height="20" fill="#F1F5F9"/>

  <!-- Klembord clip -->
  <rect x="196" y="108" width="120" height="44" rx="12" fill="#1A1A2E"/>
  <rect x="216" y="118" width="80" height="24" rx="8" fill="#334155"/>

  <!-- SG initialen groot -->
  <text x="256" y="258" font-family="sans-serif" font-size="96" font-weight="800" fill="#00A651" text-anchor="middle">SG</text>

  <!-- Lijntjes als planning -->
  <rect x="110" y="288" width="200" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="110" y="310" width="160" height="10" rx="5" fill="#CBD5E1"/>
  <rect x="110" y="332" width="180" height="10" rx="5" fill="#CBD5E1"/>

  <!-- Vinkje rechts -->
  <circle cx="370" cy="318" r="36" fill="#00A651"/>
  <text x="370" y="330" font-family="sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">✓</text>

  <!-- Onderste balk -->
  <rect x="80" y="390" width="352" height="50" rx="18" fill="#00A651"/>
  <text x="256" y="422" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">KeuringsPlanner</text>
</svg>
